<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DonDonGo · 장부 전환 목업</title>
<style>
:root{--ink:#213332;--muted:#596D69;--bg:#F7F9F9;--surface:#fff;--soft:#E1EEEA;--primary:#12695D;--border:#D2DDDA;--line:#E3EAE8;--expense:#A83A38;--income:#24755A;--warn:#FFF3DA}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 'Noto Sans KR','Malgun Gothic',system-ui,sans-serif}button,select{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:2px solid var(--primary);outline-offset:3px}button:disabled{cursor:not-allowed;opacity:.55}header{border-bottom:1px solid var(--line);background:var(--surface)}.top{max-width:1120px;margin:auto;padding:14px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:850;color:var(--primary);letter-spacing:-.04em;font-size:23px}.brand i{display:inline-block;width:12px;height:12px;margin-right:7px;background:var(--primary);border-radius:3px 3px 7px 3px}.shell{max-width:1120px;margin:auto;display:grid;grid-template-columns:170px minmax(0,1fr);gap:34px;padding:28px 22px}.rail{display:grid;align-content:start;gap:6px}.rail button{border:0;text-align:left;padding:10px 12px;border-radius:8px;background:none;color:var(--muted);min-height:42px}.rail button[aria-current=page]{background:var(--soft);color:var(--primary);font-weight:750}.switch,.outline,select{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:7px 11px;min-height:40px}.switch{display:flex;align-items:center;gap:8px;font-weight:700}.switch svg{width:13px;height:13px}.primary{background:var(--primary);color:#fff;border:0;border-radius:8px;padding:9px 14px;font-weight:700;min-height:42px}.tag{font-size:12px;color:var(--primary);background:var(--soft);border-radius:6px;padding:2px 6px;white-space:nowrap}.overline{color:var(--muted);font-size:13px;margin:0 0 6px}.headline{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}h1{font-size:30px;line-height:1.2;margin:0;letter-spacing:-.045em}h2{font-size:17px;margin:0}.summary{margin:20px 0 18px;padding:16px 18px;background:var(--soft);border-radius:8px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.summary div+div{border-left:1px solid var(--border);padding-left:14px}.summary span{display:block;font-size:13px;color:var(--muted)}.summary strong{display:block;font-size:clamp(15px,2.6vw,22px);font-variant-numeric:tabular-nums}.block{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}.row,.blockhead{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px}.row+.row,.blockhead+.row{border-top:1px solid var(--line)}.row small,.option small{display:block;color:var(--muted)}.row strong:last-child{white-space:nowrap;font-variant-numeric:tabular-nums}.expense{color:var(--expense)}.income{color:var(--income)}.hint{color:var(--muted);margin:10px 0 16px;font-size:13px}.review{margin:24px 0 0;border-top:1px solid var(--line);padding-top:12px;display:flex;align-items:center;gap:9px;flex-wrap:wrap;color:var(--muted);font-size:13px}.review select{min-height:34px;padding:4px 8px}.status{background:var(--warn);border-radius:8px;padding:10px;margin:0 0 12px}.status:empty{display:none}dialog{width:min(420px,calc(100% - 32px));padding:0;border:1px solid var(--border);border-radius:12px;color:var(--ink)}dialog::backdrop{background:#21333255}.dialog-title{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}.dialog-content{padding:8px 12px 14px}.option{display:flex;justify-content:space-between;align-items:center;text-align:left;width:100%;border:0;border-radius:8px;background:none;padding:11px;margin:3px 0}.option:hover,.option[aria-pressed=true]{background:var(--soft)}.option b{display:block}.close{padding:4px 9px;min-height:32px}.bar{height:8px;border-radius:4px;background:var(--soft);margin-top:6px}.bar i{display:block;height:100%;background:var(--primary);border-radius:4px} [hidden]{display:none!important}
@media(max-width:680px){.top{padding:10px 14px}.brand{font-size:20px}.shell{padding:0 14px 24px;display:block}.rail{grid-template-columns:repeat(3,1fr);gap:4px;margin:9px 0 16px}.rail button{text-align:center;padding:7px}.summary{padding:12px 10px;gap:6px}.summary div+div{padding-left:8px}.row,.blockhead{padding:10px 11px}h1{font-size:25px}}
</style>
<header><div class="top"><div class="brand"><i></i>DonDonGo</div><button id="switch" class="switch" aria-haspopup="dialog"><span id="book">내 가계부</span><span id="source" class="tag">이 기기</span><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m3 6 5 5 5-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div></header>
<div class="shell">
<nav class="rail" aria-label="주 메뉴"><button data-page="home" aria-current="page">홈</button><button data-page="transactions">거래 목록</button><button data-page="monthly">월 결산</button></nav>
<main>
<p class="overline" id="scope">내 가계부 · 이 기기</p>
<div class="headline"><h1 id="title">홈</h1><label>조회 월 <select id="month"><option>2026-11</option><option>2026-10</option></select></label></div>
<p class="hint" id="access">이 기기에 저장된 거래를 보고 있습니다.</p>
<section class="summary" aria-label="월별 요약"><div><span>수입</span><strong id="income"></strong></div><div><span>지출</span><strong id="expense"></strong></div><div><span>월 순액</span><strong id="net"></strong></div></section>
<section class="block" id="transactions"><div class="blockhead"><h2 id="list-title">최근 거래</h2><button id="next" class="outline">거래 목록 보기</button></div><div id="rows"></div></section>
<section class="block" id="monthly" hidden><div class="blockhead"><h2>분류별 지출</h2><button id="back-list" class="outline">거래 목록 보기</button></div><div id="categories"></div></section>
<p class="hint" id="payment-hint" hidden>카드대금 납부는 거래 목록에 표시하고 월 수입·지출에는 포함하지 않습니다.</p>
<div class="review"><strong>목업 · 합성 데이터</strong><label>전환 상태 <select id="scenario"><option value="ok">정상</option><option value="login">로그인 필요</option><option value="expired">세션 만료</option><option value="denied">권한 없음</option><option value="offline">연결 실패</option></select></label></div>
</main></div>
<dialog id="dialog" aria-labelledby="dialog-heading"><div class="dialog-title"><h2 id="dialog-heading">장부 선택</h2><button class="outline close" id="close" aria-label="장부 선택 닫기">닫기</button></div><div class="dialog-content"><p id="feedback" class="status" role="status"></p><button class="option" data-book="local" aria-pressed="true"><span><b>내 가계부</b><small>이 기기에 저장된 장부</small></span><span class="tag">이 기기</span></button><button class="option" data-book="cloud" aria-pressed="false"><span><b>파일럿 장부</b><small>Firebase · 읽기 전용</small></span><span class="tag">Firebase</span></button><button id="sign-in" class="primary" hidden>Google로 로그인</button></div></dialog>
<script>
const byId=id=>document.getElementById(id), all=query=>[...document.querySelectorAll(query)], dialog=byId('dialog');
const money=value=>new Intl.NumberFormat('ko-KR').format(value)+'원';
const samples={local:[['용돈','수입',60000,'11.05'],['점심','식비',15000,'11.04']],cloud:[['월급','수입',1200000,'11.05'],['장보기','식비',62000,'11.04'],['버스','교통',9000,'11.04'],['카드대금 납부','카드대금',85000,'11.03']]};
const labels={home:'홈',transactions:'거래 목록',monthly:'월 결산'};
const failures={login:'파일럿 장부를 열려면 로그인해주세요.',expired:'로그인 유지 기간이 끝났습니다. 다시 로그인해주세요.',denied:'이 계정은 파일럿 장부를 열 수 없습니다.',offline:'서버에 연결하지 못했습니다. 다시 시도해주세요.'};
let book='local',page='home',pending;
function render(){
 const cloud=book==='cloud',name=cloud?'파일럿 장부':'내 가계부',source=cloud?'Firebase':'이 기기',previous=byId('month').value==='2026-10';
 const data=samples[book].map(([title,type,amount,date])=>[title,type,previous?Math.round(amount*.8):amount,previous?date.replace('11.','10.'):date]);
 const income=data.filter(r=>r[1]==='수입').reduce((sum,r)=>sum+r[2],0), expenses=data.filter(r=>!['수입','카드대금'].includes(r[1])),expense=expenses.reduce((sum,r)=>sum+r[2],0);
 byId('book').textContent=name;byId('source').textContent=source;byId('scope').textContent=name+' · '+source;
 byId('access').textContent=cloud?'서버에서 조회한 장부입니다. 현재 읽기 전용입니다.':'이 기기에 저장된 거래를 보고 있습니다.';
 byId('title').textContent=labels[page];byId('income').textContent=money(income);byId('expense').textContent=money(expense);byId('net').textContent=money(income-expense);
 byId('transactions').hidden=page==='monthly';byId('monthly').hidden=page!=='monthly';byId('payment-hint').hidden=!cloud||page==='home';
 byId('list-title').textContent=page==='home'?'최근 거래':'이달 거래';byId('next').textContent=page==='home'?'거래 목록 보기':'월 결산 보기';
 byId('rows').innerHTML=data.map(([title,type,amount,date])=>'<div class="row"><div><strong>'+title+'</strong><small>'+date+' · '+type+'</small></div><strong class="'+(type==='수입'?'income':type==='카드대금'?'':'expense')+'">'+(type==='수입'?'+':type==='카드대금'?'':'−')+money(amount)+'</strong></div>').join('');
 byId('categories').innerHTML=expenses.map(([,type,amount])=>'<div class="row"><div style="flex:1"><strong>'+type+'</strong><div class="bar"><i style="width:'+Math.round(amount/expense*100)+'%"></i></div></div><strong>'+money(amount)+'</strong></div>').join('');
 all('[data-page]').forEach(b=>b.dataset.page===page?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'));
 all('[data-book]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.book===book)));
}
function show(next){page=next;render()}
function activate(next){book=next;dialog.close();render()}
function loadCloud(){
 byId('sign-in').hidden=true;byId('feedback').textContent='파일럿 장부를 불러오는 중…';
 all('[data-book]').forEach(b=>b.disabled=true);
 pending=setTimeout(()=>activate('cloud'),450);
}
byId('switch').onclick=()=>{byId('feedback').textContent='';byId('sign-in').hidden=true;dialog.showModal()};
byId('close').onclick=()=>dialog.close();dialog.addEventListener('close',()=>{clearTimeout(pending);all('[data-book]').forEach(b=>b.disabled=false);byId('switch').focus()});
all('[data-book]').forEach(b=>b.onclick=()=>{const next=b.dataset.book;if(next===book||next==='local')return activate(next);const state=byId('scenario').value;if(state==='ok')return loadCloud();byId('feedback').textContent=failures[state];byId('sign-in').hidden=!['login','expired'].includes(state)});
all('[data-page]').forEach(b=>b.onclick=()=>show(b.dataset.page));byId('month').onchange=render;byId('next').onclick=()=>show(page==='home'?'transactions':'monthly');byId('back-list').onclick=()=>show('transactions');byId('sign-in').onclick=loadCloud;render();
</script>
